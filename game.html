<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Family Feud game - offline web-based game show experience">
  <meta name="theme-color" content="#0d0d0d">
  <title>Family Feud — Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="game">

  <!-- Full-screen wrong-answer overlay — shown briefly on X key press -->
  <div id="strike-overlay" aria-live="assertive" aria-label="Wrong answer">✗</div>

  <main id="game-main">

    <!-- No-data error state -->
    <p id="no-data-msg" hidden>
      No game data found. Please return to the <a href="index.html">Setup Page</a> to configure your sessions.
    </p>

    <!-- Session navigation + board block -->
    <div id="game-block">

      <!-- Nav row: Prev — question — Next — Fullscreen -->
      <div id="game-nav">
        <button id="nav-prev" aria-label="Previous session" disabled>&#9664; Prev</button>
        <h1 id="question-text"></h1>
        <button id="nav-next" aria-label="Next session">Next &#9654;</button>
        <button id="fullscreen-btn" aria-label="Toggle fullscreen" title="Fullscreen (F)">⛶</button>
      </div>

      <!-- Answer slots rendered here by renderBoard() -->
      <div id="board" aria-label="Answer board"></div>

    </div><!-- /#game-block -->

    <!-- Bottom bar: Team 1 | Timer | Team 2 -->
    <div id="bottom-bar" aria-label="Game controls">

      <div id="team1-panel" class="team-panel active" aria-label="Team 1 score panel">
        <span class="team-label">TEAM 1</span>
        <span id="team1-score" class="team-score" aria-live="polite">0</span>
      </div>

      <div id="timer-display" aria-live="polite" aria-label="Timer">00:00</div>

      <div id="team2-panel" class="team-panel" aria-label="Team 2 score panel">
        <span class="team-label">TEAM 2</span>
        <span id="team2-score" class="team-score" aria-live="polite">0</span>
      </div>

    </div><!-- /#bottom-bar -->

    <!-- Keyboard shortcut reference -->
    <div id="shortcut-ref" aria-label="Keyboard shortcuts">
      1–9 / 0 = Reveal &nbsp;|&nbsp; X = Wrong buzz &nbsp;|&nbsp; / = Reset buzz &nbsp;|&nbsp; \ = Switch team &nbsp;|&nbsp; T = Timer &nbsp;|&nbsp; R = Reset timer &nbsp;|&nbsp; F = Fullscreen &nbsp;|&nbsp; ◀ ▶ = Session
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
